name: API Tests — Newman (Postman)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, staging, prod]
  schedule:
    - cron: '0 6 * * *'

env:
  NODE_VERSION: '22'

jobs:
  api-tests:
    name: Newman API Tests — ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API tests
        run: |
          newman run docs/api/aisss-api-collection.json \
            --environment docs/api/environments/${{ github.event.inputs.environment || 'dev' }}.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report.html \
            --bail

      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report-${{ github.event.inputs.environment || 'dev' }}
          path: newman-report.html
          retention-days: 7
