# Deploy workflow — triggers on dev (dev env) and main (prod env)
name: Deploy — Infrastructure & Backend

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, prod]
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'
  TF_VERSION: '1.9.0'

jobs:
  # ─── Resolve Environment ────────────────────────────────────────────────────
  setup:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      tf_action: ${{ steps.resolve.outputs.tf_action }}

    steps:
      - name: Resolve target environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "tf_action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "tf_action=apply" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "tf_action=apply" >> $GITHUB_OUTPUT
          fi

  # ─── Deploy Infrastructure ──────────────────────────────────────────────────
  infrastructure:
    name: Terraform — ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/environments/${{ needs.setup.outputs.environment }}
        env:
          TF_VAR_github_access_token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var-file=terraform.tfvars
        working-directory: infrastructure/environments/${{ needs.setup.outputs.environment }}
        env:
          TF_VAR_github_access_token: ${{ secrets.GH_ACCESS_TOKEN }}
          TF_VAR_domain: ${{ secrets.DOMAIN }}
          TF_VAR_ses_from_email: ${{ secrets.SES_FROM_EMAIL }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

      - name: Terraform Apply
        if: needs.setup.outputs.tf_action == 'apply'
        run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/environments/${{ needs.setup.outputs.environment }}

  # ─── Deploy Backend (Lambda) ────────────────────────────────────────────────
  backend:
    name: Deploy Backend — ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, infrastructure]
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Run unit tests
        run: npm run test
        working-directory: backend

      - name: Deploy Lambda functions
        run: npm run deploy:${{ needs.setup.outputs.environment }}
        working-directory: backend
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Backend deployed to ${{ needs.setup.outputs.environment }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Backend deployment failed for ${{ needs.setup.outputs.environment }}"
