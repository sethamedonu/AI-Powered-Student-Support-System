name: E2E Tests — Playwright

on:
  # Only run E2E on manual dispatch — prevents failures on push until
  # E2E_TEST_USER_EMAIL / E2E_TEST_USER_PASSWORD secrets are configured
  # and the test suite is written for the Next.js app.
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to run E2E tests against'
        required: true
        default: 'https://dev.dwfkamikpgffo.amplifyapp.com'

env:
  NODE_VERSION: '22'

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: frontend

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://dev.dwfkamikpgffo.amplifyapp.com' }}
          TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
